# Postgres LOKAL untuk `npm run dev` (data TETAP ada walau Docker di-restart). Bukan untuk produksi.
# Terpisah dari docker-compose.yml (DB tes, tmpfs, port 54329) supaya `npm run test:db` yang
# menjalankan `docker compose down` tidak menyentuh DB dev ini.
#
#   docker compose -f docker-compose.dev.yml up -d --wait   # nyalakan
#   node scripts/siapkan-db-dev.mjs                         # migrate + password app_server + seed jenis sampah
#   docker compose -f docker-compose.dev.yml down -v        # hapus DB dev beserta datanya
name: bank-sampah-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54330:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  data:
